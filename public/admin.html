<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Recepción / Secretarias - Clínica Médica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #00a884;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #0b141a;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #00a884, #059669);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .container {
      max-width: 1400px;
      width: 100%;
      margin: 24px auto;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stat-title {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
    }

    .stat-num {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--accent);
    }

    .filters-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      background: var(--card-bg);
      padding: 14px 20px;
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    .tab-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .btn-seed {
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-seed:hover {
      opacity: 0.9;
    }

    .btn-clear {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-clear:hover {
      background: rgba(239, 68, 68, 0.3);
    }

    .consultas-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 20px;
    }

    .card-consulta {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .opcion-tag {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .status-tag {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .status-pendiente {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
    }

    .status-atendido {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
    }

    .patient-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.9rem;
    }

    .phone-link {
      color: #34d399;
      text-decoration: none;
      font-weight: 600;
    }

    .raw-msg {
      background: rgba(15, 23, 42, 0.6);
      padding: 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      color: #cbd5e1;
      white-space: pre-wrap;
      max-height: 140px;
      overflow-y: auto;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* ── Vista previa de imagen en la tarjeta ── */
    .card-img-container {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #0f172a;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card-img-preview {
      width: 100%;
      max-height: 180px;
      object-fit: cover;
      display: block;
      transition: transform 0.2s;
    }

    .card-img-container:hover .card-img-preview {
      transform: scale(1.02);
    }

    .card-img-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.85);
      padding: 6px 10px;
      font-size: 0.75rem;
      color: #38bdf8;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(4px);
    }

    /* ── Modal Lightbox para Ampliar Imagen ── */
    .lightbox-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.2s ease-out;
    }

    .lightbox-img {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      border: 2px solid rgba(255,255,255,0.2);
      object-fit: contain;
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 24px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .lightbox-close:hover {
      background: #ef4444;
    }

    .reply-box {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .reply-box label {
      font-size: 0.8rem;
      font-weight: 700;
      color: #94a3b8;
    }

    .reply-box textarea {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 10px;
      color: var(--text);
      font-size: 0.88rem;
      resize: vertical;
      min-height: 65px;
      outline: none;
    }

    .reply-box textarea:focus {
      border-color: var(--accent);
    }

    .quick-reply-chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chip {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .chip:hover {
      background: rgba(0, 168, 132, 0.2);
      color: #34d399;
    }

    .reply-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-wa-direct {
      background: #25D366;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .btn-wa-direct:hover {
      opacity: 0.9;
    }

    .btn-api-send {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-api-send:hover {
      background: #008f70;
    }

    .drive-link-btn {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
      padding: 6px 10px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      justify-content: center;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">📋</div>
      <div>
        <h1 style="font-size: 1.2rem;">Panel de Recepción / Secretarias</h1>
        <div style="font-size: 0.8rem; color: var(--muted);">Gestión y Respuesta Directa a Consultas de WhatsApp</div>
      </div>
    </div>

    <div style="display: flex; gap: 10px; align-items: center;">
      <button onclick="generar70Pruebas(event)" class="btn-seed">⚡ Generar 70 Consultas de Prueba</button>
      <button onclick="limpiarTodasPruebas()" class="btn-clear" title="Vaciar todas las consultas y chats de prueba">🗑️ Limpiar Todo</button>
      <button onclick="fetchConsultas()" class="tab-btn" style="background: rgba(255,255,255,0.05);">🔄 Actualizar</button>
    </div>
  </header>

  <div class="container">

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-title">Consultas Pendientes</div>
        <div class="stat-num" id="numPendientes">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Atendidas / Agendadas</div>
        <div class="stat-num" id="numAtendidas" style="color: #60a5fa;">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Total Recibidas</div>
        <div class="stat-num" id="numTotal" style="color: #a78bfa;">0</div>
      </div>
    </div>

    <div class="filters-bar">
      <span style="font-size: 0.85rem; color: var(--muted); font-weight: 600;">Filtrar por Estado:</span>
      <button class="tab-btn active" onclick="setFilter('todos', this)">Todas</button>
      <button class="tab-btn" onclick="setFilter('pendiente', this)">Pendientes</button>
      <button class="tab-btn" onclick="setFilter('atendido', this)">Atendidas</button>
    </div>

    <div class="consultas-grid" id="consultasGrid">
      <div style="color: var(--muted); grid-column: 1 / -1; padding: 40px; text-align: center;">Cargando consultas...</div>
    </div>

  </div>

  <!-- Modal Lightbox para Ampliar Fotos de Orden Médica -->
  <div id="lightboxModal" class="lightbox-modal" style="display: none;" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    <img id="lightboxImg" class="lightbox-img" src="" alt="Foto ampliada" onclick="event.stopPropagation()">
  </div>

  <script>
    let allConsultas = [];
    let currentFilter = 'todos';
    let draftResponses = {};

    window.addEventListener('DOMContentLoaded', () => {
      fetchConsultas();
      setInterval(fetchConsultas, 8000);
    });

    function saveDraft(cardId, value) {
      draftResponses[cardId] = value;
    }

    function openLightbox(imgSrc) {
      const modal = document.getElementById('lightboxModal');
      const img = document.getElementById('lightboxImg');
      img.src = imgSrc;
      modal.style.display = 'flex';
    }

    function closeLightbox() {
      const modal = document.getElementById('lightboxModal');
      modal.style.display = 'none';
    }

    async function fetchConsultas() {
      try {
        const res = await fetch('/api/consultas');
        const data = await res.json();
        allConsultas = data.consultas || [];
        updateStats();
        renderConsultas();
      } catch (err) {
        console.error('Error al cargar consultas:', err);
      }
    }

    async function generar70Pruebas(evt) {
      const btn = evt ? evt.target : document.querySelector('.btn-seed');
      btn.innerText = '⏳ Generando...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/seed-consultas', { method: 'POST' });
        const data = await res.json();
        alert(`✅ ${data.mensaje || '70 consultas generadas exitosamente'}`);
        fetchConsultas();
      } catch (e) {
        alert('Error al generar datos de prueba.');
      } finally {
        btn.innerText = '⚡ Generar 70 Consultas de Prueba';
        btn.disabled = false;
      }
    }

    async function limpiarTodasPruebas() {
      if (!confirm('⚠️ ¿Estás seguro de que deseas vaciar y eliminar todas las consultas y chats de prueba?')) {
        return;
      }

      try {
        const res = await fetch('/api/clear-consultas', { method: 'POST' });
        const data = await res.json();
        draftResponses = {};
        alert('🗑️ ' + (data.mensaje || 'Consultas eliminadas correctamente.'));
        fetchConsultas();
      } catch (e) {
        alert('Error al vaciar consultas.');
      }
    }

    function updateStats() {
      const pendientes = allConsultas.filter(c => (c.estado || 'pendiente') === 'pendiente').length;
      const atendidas = allConsultas.filter(c => c.estado === 'atendido').length;
      
      document.getElementById('numPendientes').innerText = pendientes;
      document.getElementById('numAtendidas').innerText = atendidas;
      document.getElementById('numTotal').innerText = allConsultas.length;
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filters-bar .tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderConsultas();
    }

    function insertTemplate(cardId, templateText) {
      const textarea = document.getElementById(`replyText_${cardId}`);
      if (textarea) {
        textarea.value = templateText;
        draftResponses[cardId] = templateText;
      }
    }

    function renderConsultas() {
      const container = document.getElementById('consultasGrid');

      document.querySelectorAll('.reply-box textarea').forEach(ta => {
        const cardId = ta.id.replace('replyText_', '');
        draftResponses[cardId] = ta.value;
      });
      
      let filtered = allConsultas;
      if (currentFilter === 'pendiente') {
        filtered = allConsultas.filter(c => (c.estado || 'pendiente') === 'pendiente');
      } else if (currentFilter === 'atendido') {
        filtered = allConsultas.filter(c => c.estado === 'atendido');
      }

      if (filtered.length === 0) {
        container.innerHTML = `<div style="color: var(--muted); grid-column: 1 / -1; padding: 60px; text-align: center; background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border);">No hay consultas en esta categoría.</div>`;
        return;
      }

      container.innerHTML = filtered.map(c => {
        const isPendiente = (c.estado || 'pendiente') === 'pendiente';
        const cleanPhone = (c.remitente || '').replace(/\D/g, '');
        const fecha = new Date(c.timestamp || c.createdAt || Date.now()).toLocaleString('es-AR');

        const datos = c.datos || {};
        const contenidoMsg = datos.contenidoMensaje || datos.mensajeRaw || '';
        const imgUrl = datos.imagenUrl;
        const imgBase64 = datos.imagenBase64;
        const proveedor = datos.proveedorAlmacenamiento || 'Drive';
        const currentDraft = draftResponses[c.id] || '';

        // Determinar qué imagen mostrar directamente dentro de la tarjeta
        const displayImg = imgBase64 || (imgUrl && !imgUrl.includes('drive.google.com/file/d/demo_drive_') ? imgUrl : null);

        return `
          <div class="card-consulta">
            <div class="card-header">
              <span class="opcion-tag">${c.opcion || 'Consulta'}</span>
              <span class="status-tag ${isPendiente ? 'status-pendiente' : 'status-atendido'}">${isPendiente ? '⏳ Pendiente' : '✅ Atendido'}</span>
            </div>

            <div class="patient-info">
              <div><strong>Paciente:</strong> <span class="phone-link">📱 ${c.remitente}</span></div>
              <div style="font-size: 0.78rem; color: var(--muted);">📅 Recibido: ${fecha}</div>
            </div>

            <div class="raw-msg">${contenidoMsg}</div>

            ${displayImg ? `
              <div class="card-img-container" onclick="openLightbox('${displayImg}')" title="Clic para ampliar orden médica">
                <img src="${displayImg}" class="card-img-preview" alt="Foto del pedido médico / carnet">
                <div class="card-img-overlay">
                  <span>🔍 Clic para ampliar</span>
                  ${imgUrl ? `<a href="${imgUrl}" target="_blank" onclick="event.stopPropagation()" class="drive-link-btn">🔗 ${proveedor}</a>` : ''}
                </div>
              </div>
            ` : (imgUrl ? `
              <a href="${imgUrl}" target="_blank" class="drive-link-btn">
                📷 Ver Foto Pedido / Carnet (${proveedor})
              </a>
            ` : '')}

            <div class="reply-box">
              <label>💬 Escribir Respuesta al Paciente:</label>

              <div class="quick-reply-chips">
                <span class="chip" onclick="insertTemplate('${c.id}', '¡Hola! Tu turno ha sido agendado exitosamente para el día [Fecha] a las [Hora] hs. Te esperamos.')">✅ Confirmar Turno</span>
                <span class="chip" onclick="insertTemplate('${c.id}', '¡Hola! Por favor envíanos una foto más legible de tu pedido médico u orden para procesar tu solicitud.')">📷 Pedir Foto Legible</span>
                <span class="chip" onclick="insertTemplate('${c.id}', '¡Hola! Tu solicitud PAMI fue ingresada correctamente. Nos comunicaremos cuando la orden esté emitida.')">🩺 Estado PAMI</span>
              </div>

              <textarea id="replyText_${c.id}" oninput="saveDraft('${c.id}', this.value)" placeholder="Escribe tu respuesta personalizada aquí...">${currentDraft}</textarea>

              <div class="reply-actions">
                <button type="button" class="btn-wa-direct" onclick="responderPorWhatsAppWeb('${c.remitente}', '${c.id}')">
                  🟢 Abrir en WhatsApp Web
                </button>
                <button type="button" class="btn-api-send" onclick="responderViaApi('${c.remitente}', '${c.id}')">
                  📤 Enviar Automático (API)
                </button>
              </div>
            </div>
          </div>
        `;
      }).reverse().join('');
    }

    async function responderPorWhatsAppWeb(remitente, cardId) {
      const textarea = document.getElementById(`replyText_${cardId}`);
      const texto = textarea ? textarea.value.trim() : (draftResponses[cardId] || '');

      const cleanPhone = remitente.replace(/\D/g, '');
      const encodedMsg = encodeURIComponent(texto || '¡Hola! Nos comunicamos desde la Secretaría de la Clínica Médica.');
      const waUrl = `https://web.whatsapp.com/send?phone=${cleanPhone}&text=${encodedMsg}`;

      window.open(waUrl, '_blank');

      if (texto) {
        await fetch('/api/send-message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ remitente, respuesta: texto, idConsulta: cardId })
        });
      } else {
        await marcarAtendido(cardId);
      }

      delete draftResponses[cardId];
      fetchConsultas();
    }

    async function responderViaApi(remitente, cardId) {
      const textarea = document.getElementById(`replyText_${cardId}`);
      const respuesta = textarea ? textarea.value.trim() : (draftResponses[cardId] || '');

      if (!respuesta) {
        alert('Por favor escribe un mensaje de respuesta antes de enviar.');
        return;
      }

      try {
        const res = await fetch('/api/send-message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            remitente,
            respuesta,
            idConsulta: cardId
          })
        });

        const data = await res.json();
        if (data.success) {
          delete draftResponses[cardId];
          alert(`✅ Respuesta enviada a ${remitente}`);
          fetchConsultas();
        } else {
          alert(`❌ Error: ${data.error || 'No se pudo enviar'}`);
        }
      } catch (err) {
        alert('Error al conectar con el servidor.');
      }
    }

    async function marcarAtendido(id) {
      try {
        const res = await fetch(`/api/consultas/${id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ estado: 'atendido' })
        });
        if (res.ok) {
          fetchConsultas();
        }
      } catch (err) {
        console.error('Error al actualizar estado:', err);
      }
    }
  </script>
</body>
</html>
